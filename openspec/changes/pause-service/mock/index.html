<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokenBoss · 停服提示交互原型</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--background,#eeece8);color:var(--foreground,#292524);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit;text-underline-offset:4px}button:focus-visible,a:focus-visible{outline:3px solid #0369a1;outline-offset:4px}button:disabled{cursor:default}button,a{touch-action:manipulation}[hidden]{display:none!important}
    .review{padding:24px 24px 18px;max-width:1250px;margin:auto}.review-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.review h1{font-size:20px;letter-spacing:-.5px;margin:0;font-weight:650}.review p{margin:5px 0 16px;color:var(--muted-foreground,#78716c);font-size:13px}.draft{font-size:11px;border:1px solid var(--border,#d6d3d1);padding:2px 7px;border-radius:4px}.tools{display:flex;align-items:center;flex-wrap:wrap;gap:12px;justify-content:space-between}.group{display:flex;flex-wrap:wrap;gap:3px;padding:3px;border:1px solid var(--border,#d6d3d1);border-radius:7px;background:var(--card,#fafaf9)}.group button{padding:6px 12px;border:0;border-radius:4px;color:var(--muted-foreground,#78716c);background:none;font-size:12px}.group button[aria-pressed=true]{background:var(--foreground,#292524);color:var(--background,#fff)}.right-tools{display:flex;gap:10px;flex-wrap:wrap}.preview-wrap{padding:0 24px 24px}.site{color-scheme:light;--cream:#f7f3ee;--ink:#1c1917;--muted:#6b5e52;--orange:#e8692a;color:var(--ink);background:var(--cream);max-width:1200px;margin:auto;border:1px solid #c8bfb5;border-radius:9px;overflow:hidden;container-type:inline-size;box-shadow:0 4px 24px #00000008}.site[data-device=mobile]{max-width:390px}.site button{color:inherit}.site a{cursor:pointer}.banner{background:#fef3c7;border-bottom:2px solid var(--ink);padding:15px 30px}.banner-inner{display:flex;gap:18px;max-width:1080px;margin:auto;align-items:flex-start}.tag{display:inline-block;white-space:nowrap;font-size:11px;font-weight:800;letter-spacing:.04em;border:1.5px solid var(--ink);border-radius:3px;padding:3px 8px;background:#facc15;line-height:1.6}.banner-copy{font-size:14px;line-height:1.8;flex:1}.banner-copy p{margin:0}.banner-copy .sub{font-size:13px;color:#65512b}.text-link{background:none;border:none;padding:0;text-decoration:underline;text-underline-offset:4px;font-weight:650}.nowrap{white-space:nowrap}.date-chunk{white-space:nowrap}.nav{display:flex;justify-content:space-between;align-items:center;gap:20px;max-width:1120px;margin:auto;padding:25px 30px}.brand{display:inline-block;transform:rotate(-2.5deg);padding:5px 12px;background:var(--orange);color:white!important;border:2px solid var(--ink);border-radius:5px;box-shadow:3px 3px 0 var(--ink);font-weight:850;font-size:15px;text-decoration:none;letter-spacing:-.3px}.nav-links{display:flex;gap:22px;align-items:center;font-size:13px}.nav-links a{text-decoration:none}.nav-links .active{background:var(--ink);color:white;padding:4px 12px;border-radius:4px}.hero{max-width:1120px;margin:auto;padding:45px 48px 54px}.eyebrow{font:11px/1.7 ui-monospace,monospace;letter-spacing:.11em;color:var(--muted);margin:0 0 18px}.hero-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:45px;align-items:center}.hero h2{font-size:clamp(36px,4.6cqw,60px);line-height:1.14;letter-spacing:-2px;margin:0 0 22px;font-weight:850}.orange{color:var(--orange)}.lead{color:var(--muted);font-size:15px;line-height:1.85;margin:0 0 22px}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:8px;padding:11px 19px;border:2px solid var(--ink);border-radius:5px;box-shadow:3px 3px 0 var(--ink);font-size:14px;font-weight:700;background:white;color:var(--ink);transition:transform .12s,box-shadow .12s}.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}.btn.primary{background:var(--orange);color:white}.hero-actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}.section{max-width:1120px;margin:auto;padding:24px 48px 48px}.section-title{font-size:23px;margin:0 0 18px;letter-spacing:-.6px}.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.price-card{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:22px;box-shadow:3px 3px 0 var(--ink)}.price-card h3{margin:14px 0 8px;font-size:22px}.price-card p{font-size:13px;color:var(--muted);margin:0 0 18px}.price-card .btn{font-size:12px;padding:8px 11px;box-shadow:2px 2px 0 var(--ink)}.divider{border:0;border-top:2px solid var(--ink);margin:0}.footer{background:var(--ink);color:#fff;padding:30px 48px;display:flex;gap:22px;justify-content:space-between;align-items:center}.footer-name{font-weight:750;font-size:15px}.footer .copyright{font-size:11px;color:#b1a79d;margin-top:5px}.footer-links{display:flex;flex-direction:column;gap:6px;text-align:right;font-size:12px;color:#e1d8ce}.footer-email{font-family:ui-monospace,monospace;font-size:13px}.notice-main{max-width:680px;margin:auto;padding:35px 28px 56px}.crumb{font-size:12px;color:var(--muted);margin:0 0 24px}.crumb button{color:var(--muted)!important;font-weight:400}.notice-main h2{font-size:32px;line-height:1.3;letter-spacing:-1px;margin:0 0 12px}.notice-intro{font-size:14px;color:var(--muted);margin:0 0 24px}.time-card{background:#fef3c7;border:2px solid var(--ink);border-radius:6px;padding:22px 24px;box-shadow:3px 3px 0 var(--ink);margin:0 0 26px}.time-label{font-size:11px;font-weight:700;letter-spacing:.07em;margin-bottom:9px;color:#713f12}.date{font-family:ui-monospace,monospace;font-size:clamp(21px,3.2cqw,30px);font-weight:750;letter-spacing:-1px;line-height:1.4}.zone{font-size:12px;color:#713f12;margin-top:6px}.notice-body{font-size:14px;line-height:1.9;margin:0 0 26px}.refund-card{background:#fff;border:2px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 var(--ink);padding:26px}.refund-card h3{font-size:21px;margin:0 0 8px;letter-spacing:-.4px}.refund-card p{font-size:14px;color:var(--muted);margin:0 0 12px;line-height:1.85}.email{display:inline-block;font-size:23px;font-weight:750;font-family:ui-monospace,monospace;letter-spacing:-.6px;margin:0 0 18px;text-decoration-thickness:1px;overflow-wrap:anywhere}.requirements{background:#f7f3ee;padding:16px 18px;border-radius:4px;margin-bottom:20px;font-size:14px}.requirements p{color:var(--ink);margin:0 0 6px;font-size:13px}.requirements ol{padding-left:22px;margin:0;line-height:1.95}.refund-actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:17px}.refund-note{font-size:12px!important;margin:0!important}.back-home{display:block;text-align:center;margin-top:25px;font-size:13px;color:var(--muted)}.policy{background:white;border:2px solid var(--ink);border-radius:6px;padding:22px}.policy h3{margin:0 0 9px;font-size:16px}.policy p{font-size:14px;color:var(--muted);margin:0;line-height:1.9}.review-note{max-width:1200px;margin:14px auto 0;font-size:12px;color:var(--muted-foreground,#78716c);text-align:center}.context{margin:0 0 14px;color:#92400e;font-size:13px;font-weight:650}.toast{font-size:12px;min-height:20px;color:var(--muted);margin-top:10px}.empty-space{padding:16px 0}
    @container(max-width:650px){.banner{padding:14px 20px}.banner-inner{display:block}.tag{margin-bottom:8px}.banner-copy{font-size:13px}.banner-copy .sub{font-size:12px;margin-top:5px;line-height:1.85}.nowrap{white-space:normal}.nav{padding:22px 20px;gap:14px}.nav-links{gap:13px;font-size:12px}.nav-links .hide-mobile{display:none}.brand{font-size:13px;padding:4px 10px}.hero{padding:26px 22px 35px}.hero-grid{grid-template-columns:1fr;gap:26px}.hero h2{font-size:38px;letter-spacing:-1.4px}.eyebrow{font-size:10px;margin-bottom:15px}.hero-actions{gap:14px}.hero .lead{font-size:14px}.section{padding:20px 22px 35px}.pricing-grid{grid-template-columns:1fr}.price-card{padding:20px}.footer{padding:28px 22px;display:block}.footer-links{text-align:left;margin-top:20px}.notice-main{padding:22px 20px 40px}.notice-main h2{font-size:26px}.time-card{padding:19px 18px}.date{font-size:23px}.notice-intro{font-size:13px}.refund-card{padding:21px 18px}.email{font-size:21px}.refund-actions{flex-direction:column}.refund-actions .btn{width:100%}.context{font-size:12px}.section-title{font-size:21px}}
    @media(max-width:580px){.review{padding:18px 12px 14px}.review h1{font-size:17px}.preview-wrap{padding:0 10px 18px}.tools{gap:9px}.group button{padding:6px 9px}.right-tools{gap:8px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="review">
    <div class="review-top"><h1>TokenBoss / 停服提示</h1><span class="draft">交互原型 · 未上线</span></div>
    <p>查看提示的位置与样式。点击站内“停服说明”，可查看完整说明及退款联系方式。</p>
    <div class="tools">
      <div class="group" aria-label="预览页面">
        <button data-view="home" aria-pressed="true">首页</button><button data-view="notice" aria-pressed="false">说明页</button><button data-view="pricing" aria-pressed="false">套餐入口</button><button data-view="refund" aria-pressed="false">退款政策</button>
      </div>
      <div class="right-tools">
        <div class="group" aria-label="预览设备"><button data-device="desktop" aria-pressed="true">桌面</button><button data-device="mobile" aria-pressed="false">手机</button></div>
        <div class="group" aria-label="预览停服阶段"><button data-phase="before" aria-pressed="true">停服前</button><button data-phase="after" aria-pressed="false">停服后</button></div>
      </div>
    </div>
  </header>
  <main class="preview-wrap">
    <div id="site" class="site" data-device="desktop"></div>
    <p class="review-note">仅用于确认视觉与交互；邮件按钮打开您自己的邮件客户端，不会自动发送邮件。</p>
  </main>
  <script>
    const state={view:'home',device:'desktop',phase:'before',context:''};
    const EMAIL='shawn@tokenboss.co';
    const mailto='mailto:'+EMAIL+'?subject='+encodeURIComponent('TokenBoss 退款申请')+'&body='+encodeURIComponent('TokenBoss 登录邮箱：\n联系微信：\n');
    const site=document.getElementById('site');
    function link(text,view='notice',context='',cls=''){return '<a href="#'+view+'" data-destination="'+view+'" data-context="'+context+'" class="'+cls+'">'+text+'</a>'}
    function banner(){const after=state.phase==='after';return '<aside class="banner" aria-label="服务暂停公告"><div class="banner-inner"><span class="tag">服务暂停公告</span><div class="banner-copy"><p>TokenBoss '+(after?'已于':'将于')+' <strong><span class="date-chunk">2026 年 12 月 16 日 00:00</span><span class="date-chunk">（北京时间）</span></strong>暂停服务。</p><p class="sub">'+(after?'模型调用、注册、登录及充值均已关闭。':'目前已关闭注册、登录及新增充值。')+(state.view==='home'?'退款申请请联系 <a href="mailto:'+EMAIL+'">'+EMAIL+'</a>。':'')+' '+link(state.view==='home'?'查看详情 →':'退款说明 →')+'</p></div></div></aside>'}
    function nav(){return '<nav class="nav" aria-label="网站导航">'+link('TokenBoss','home','','brand')+'<div class="nav-links">'+link('Wallet','home','','active')+'<span class="hide-mobile">Primitives</span>'+link('套餐','pricing','','hide-mobile')+link('停服说明','notice','')+'</div></nav>'}
    function footer(){return '<footer class="footer"><div><div class="footer-name">TokenBoss</div><div class="copyright">© 2026 TokenBoss · All rights reserved.</div></div><div class="footer-links">'+link('停服说明 →')+'<a class="footer-email" href="mailto:'+EMAIL+'">'+EMAIL+'</a>'+link('退款政策','refund')+'</div></footer>'}
    function home(){return '<section class="hero"><p class="eyebrow">OPENCLAW / HERMES / CLAUDE CODE / CODEX</p><div class="hero-grid"><div><h2>你的 Agent，<br><span class="orange">立刻用得起好模型。</span></h2><p class="lead">一行装好 → 顶级模型立刻可用 · 多 Agent 共用一份额度。</p><div class="hero-actions">'+link('停服说明 →','notice','','btn primary')+'</div></div></div></section><hr class="divider"><section class="section"><h2 class="section-title">套餐与充值</h2>'+priceCards()+'</section>'}
    function priceCards(){return '<div class="pricing-grid">'+['Plus','Super','Ultra'].map(name=>'<article class="price-card"><span class="tag" style="background:#f0ebe3">已停止销售</span><h3>'+name+'</h3><p>会员订阅与新增充值均已关闭。</p>'+link('停服说明 →','notice','新增充值已关闭','btn')+'</article>').join('')+'</div>'}
    function refundCard(){return '<section class="refund-card" aria-labelledby="refund-heading"><h3 id="refund-heading">退款申请</h3><p>有退款需求的用户，请发送邮件至：</p><a class="email" href="'+mailto+'">'+EMAIL+'</a><div class="requirements"><p>请在邮件中提供以下信息：</p><ol><li>您的 TokenBoss 登录邮箱</li><li>您的联系微信</li></ol></div><div class="refund-actions"><a class="btn primary" href="'+mailto+'">发送退款申请邮件 ↗</a><button class="btn" id="copy-email">复制邮箱</button></div><p class="refund-note">我们将后续联系核实并处理。提交申请无需登录网站。</p><div id="copy-status" class="toast" role="status" aria-live="polite"></div></section>'}
    function notice(){const after=state.phase==='after';return '<section class="notice-main"><p class="crumb">'+link('首页','home')+' / 服务暂停说明</p>'+(state.context?'<p class="context">'+state.context+'，请查看以下安排。</p>':'')+'<h2>服务暂停与退款说明</h2><p class="notice-intro">感谢您使用 TokenBoss，以下是本次服务暂停安排。</p><section class="time-card" aria-label="停服时间"><div class="time-label">'+(after?'已暂停服务':'服务暂停时间')+'</div><div class="date">2026 年 12 月 16 日<br>00:00</div><div class="zone">北京时间 · UTC+8</div></section><p class="notice-body">'+(after?'TokenBoss 已于上述时间暂停服务，模型调用、注册、登录及充值均已关闭。':'目前已停止注册、登录及新增充值。已有 API Key 可在停服前按现有余额及服务规则继续使用。')+'网站将继续保留，供您查看公告及退款联系方式。</p>'+refundCard()+link('← 返回首页','home','','back-home')+'</section>'}
    function pricing(){const reason=state.phase==='after'?'服务已暂停':'服务即将暂停';return '<section class="section"><p class="eyebrow">PRICING</p><h2 class="section-title">套餐与充值</h2><p class="lead">因'+reason+'，目前已关闭会员购买与新增充值。</p>'+priceCards()+'<div class="empty-space"></div>'+link('停服说明 →','notice','新增充值已关闭','btn')+'</section>'}
    function refund(){return '<section class="notice-main"><p class="crumb">'+link('首页','home')+' / 退款政策</p><h2>退款政策</h2><p class="notice-intro">本次服务暂停的退款申请请按下方说明提交。</p><div class="time-card"><div class="time-label">本次服务暂停的退款申请</div><p style="font-size:14px;line-height:1.9;margin:0">有退款需求的用户，可向 <strong>'+EMAIL+'</strong> 提交申请。本次申请按停服退款说明核实处理。</p></div>'+refundCard()+'<p class="small" style="margin-top:25px">以上为本次服务暂停的专项说明；正式页面在此区域下方保留原有常规条款。</p>'+link('← 返回首页','home','','back-home')+'</section>'}
    function render(){site.dataset.device=state.device;site.innerHTML=banner()+nav()+({home,notice,pricing,refund}[state.view]||home)()+footer();document.querySelectorAll('[data-view]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.view===state.view)));document.querySelectorAll('[data-device]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.device===state.device)));document.querySelectorAll('[data-phase]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.phase===state.phase)))}
    document.addEventListener('click',async event=>{const target=event.target.closest('button,a');if(!target)return;if(target.dataset.view){state.view=target.dataset.view;state.context='';render()}else if(target.dataset.device){state.device=target.dataset.device;render()}else if(target.dataset.phase){state.phase=target.dataset.phase;render()}else if(target.dataset.destination){event.preventDefault();state.view=target.dataset.destination;state.context=target.dataset.context||'';render();site.scrollIntoView({block:'start'})}else if(target.id==='copy-email'){const status=document.getElementById('copy-status');try{await navigator.clipboard.writeText(EMAIL);target.textContent='已复制';status.textContent='邮箱已复制，可粘贴到您常用的邮件应用。';}catch{status.textContent='请长按或选中上方邮箱，手动复制。';}}});
    render();
  </script>
</body>
</html>
